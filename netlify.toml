[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"
  included_files = ["config/**"]

# Active development: never let a stale app.js survive a structural change.
# Tighten these once the tool stops changing weekly.
# Asset URLs carry a content hash (tools/stamp-assets.mjs), so a stale copy
# can never be served against newer markup — cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# The pages themselves must always be re-checked, since they carry the hashes.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/config/*"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"

# Private status links carry a token in the URL — never send it onward.
[[headers]]
  for = "/status.html"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"
