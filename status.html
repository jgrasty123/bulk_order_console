<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your corporate order — The BroBasket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/order.css?v=9298d4ca">
</head>
<body>
<dialog id="contact" class="modal">
  <div>
    <p class="eyebrow">We're here to help</p>
    <h2>Questions about a corporate order?</h2>
    <p class="muted">Email us and we'll come back to you — usually the same business day.</p>
    <div class="contact__row">
      <a class="contact__value" id="contactMail" href="#">info@thebrobasket.com</a>
      <button class="btn" type="button" id="copyMail">Copy</button>
    </div>
    <p class="contact__row" id="contactPhoneRow" hidden>
      <a class="contact__value" id="contactPhone" href="#"></a>
    </p>
    <div class="modal__actions"><button class="btn" type="button" id="contactClose">Close</button></div>
  </div>
</dialog>

<header class="bar">
  <a class="brand" href="/"><img class="brand__logo" src="/assets/brobasket-logo.png" alt="The BroBasket" width="44" height="44"><span class="brand__name">The BroBasket</span><span class="brand__sub">Corporate gifting</span></a>
  <nav class="nav" aria-label="Main">
    <a class="nav__link" id="homeLink" href="#">Home</a>
    <a class="nav__link" href="/">New order</a>
    <button type="button" class="nav__link nav__link--quiet" id="helpLink">Questions?</button>
  </nav>
</header>
<main class="page">
  <section class="step">
    <p class="muted" id="loading">Loading your order…</p>
    <div id="view" hidden>
      <p class="muted mono" id="sId"></p>
      <h2 id="sHead"></h2>
      <p id="sText"></p>
      <div class="actions actions--left" id="payWrap" hidden><a class="btn btn--primary btn--big" id="payLink" href="#">Pay now</a></div>
      <div class="summary" id="sSummary"></div>
      <div class="sheet" style="margin-top:1.25rem"><table class="sheet__table sheet__table--read">
        <thead><tr><th>Recipient</th><th>Destination</th><th>Gift</th><th>Order</th><th>Delivery</th></tr></thead>
        <tbody id="sRows"></tbody></table></div>
      <p class="fine" id="sUpdated"></p>
    </div>
  </section>
</main>
<script type="module" src="/assets/status.js?v=99de0d22"></script>
</body>
</html>
